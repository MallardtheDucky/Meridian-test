    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-bg: #03070b;
            --color-panel: #06111a;
            --color-panel-border: #0c2336;
            --color-cyan: #00e5ff;
            --color-cyan-dim: #007a8a;
            --color-amber: #ffb300;
            --color-red: #ff3d00;
            --color-text-dim: #548b99;
        }

        body {
            background-color: #000;
            color: var(--color-cyan);
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
        }

        .font-mono-tech {
            font-family: 'Share Tech Mono', monospace;
        }

        .scanlines {
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%), linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,255,0.03), rgba(0,0,255,0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 9998;
        }

        .crt-vignette {
            background: radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 9999;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--color-panel); border-left: 1px solid var(--color-panel-border); }
        ::-webkit-scrollbar-thumb { background: var(--color-cyan-dim); border: 1px solid var(--color-bg); }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-cyan); }

        @keyframes flicker {
            0% { opacity: 1; } 3% { opacity: 0.4; } 6% { opacity: 1; } 7% { opacity: 0.4; } 9% { opacity: 1; } 100% { opacity: 1; }
        }
        .animate-flicker { animation: flicker 6s infinite linear; }

        @keyframes pulse-cyan {
            0%, 100% { text-shadow: 0 0 4px rgba(0,229,255,0.4), 0 0 10px rgba(0,229,255,0.2); opacity: 1; }
            50% { text-shadow: 0 0 8px rgba(0,229,255,0.8), 0 0 20px rgba(0,229,255,0.4); opacity: 0.8; }
        }
        .text-glow { animation: pulse-cyan 3s ease-in-out infinite; }
        
        .static-glow { text-shadow: 0 0 5px rgba(0,229,255,0.5), 0 0 15px rgba(0,229,255,0.2); }
        .red-glow { text-shadow: 0 0 5px rgba(255,61,0,0.5), 0 0 15px rgba(255,61,0,0.2); }
        .amber-glow { text-shadow: 0 0 5px rgba(255,179,0,0.5), 0 0 15px rgba(255,179,0,0.2); }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(1000%); }
        }
        .scanner-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(0,229,255,0.5);
            box-shadow: 0 0 10px rgba(0,229,255,1);
            animation: scan 4s linear infinite;
            pointer-events: none;
            opacity: 0.3;
        }

        .tech-border {
            border: 1px solid var(--color-panel-border);
            position: relative;
        }
        .tech-border::before {
            content: ''; position: absolute; top: -1px; left: -1px; width: 6px; height: 6px; border-top: 2px solid var(--color-cyan); border-left: 2px solid var(--color-cyan);
        }
        .tech-border::after {
            content: ''; position: absolute; bottom: -1px; right: -1px; width: 6px; height: 6px; border-bottom: 2px solid var(--color-cyan); border-right: 2px solid var(--color-cyan);
        }

        .bg-grid {
            background-image: 
                linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .window {
            position: absolute;
            background: var(--color-bg);
            border: 1px solid var(--color-cyan-dim);
            box-shadow: 0 0 30px rgba(0,0,0,0.9), inset 0 0 20px rgba(0,229,255,0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(4px);
        }
        .window-header {
            background: linear-gradient(90deg, var(--color-panel) 0%, var(--color-panel-border) 100%);
            border-bottom: 1px solid var(--color-cyan-dim);
            cursor: grab;
        }
        .window-header:active { cursor: grabbing; }
        .window.maximized {
            top: 0 !important; left: 0 !important;
            width: 100% !important; height: calc(100% - 40px) !important;
            border-radius: 0;
        }
        .window.minimized { display: none; }

        .resize-handle {
            position: absolute;
            right: 0; bottom: 0;
            width: 18px; height: 18px;
            cursor: nwse-resize;
            z-index: 50;
            background: linear-gradient(135deg, transparent 0%, transparent 45%, var(--color-cyan-dim) 45%, var(--color-cyan-dim) 55%, transparent 55%, transparent 62%, var(--color-cyan-dim) 62%, var(--color-cyan-dim) 72%, transparent 72%, transparent 79%, var(--color-cyan-dim) 79%, var(--color-cyan-dim) 89%, transparent 89%);
                opacity: 0.7;
        }
        .resize-handle:hover { opacity: 1; background-color: transparent; filter: brightness(1.6); }
        .window.maximized .resize-handle { display: none; }
        @media (max-width: 767px) {
            .resize-handle { display: none; }
        }

        input:focus { outline: none; }

        .insignia-pip {
            box-shadow: inset 0 0 5px rgba(0,0,0,0.8), 0 0 4px currentColor;
        }
        .insignia-red { color: var(--color-red); background-color: #8b0000; border: 1px solid var(--color-red); }
        .insignia-cyan { color: var(--color-cyan); background-color: #005f6b; border: 1px solid var(--color-cyan); }
        .insignia-amber { color: var(--color-amber); background-color: #8b6508; border: 1px solid var(--color-amber); }
        .insignia-blue { color: #2962ff; background-color: #0d205f; border: 1px solid #2962ff; }
        .insignia-dark { color: #548b99; background-color: #1a2c33; border: 1px solid #2c4d59; }

        .plaque-container {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            background: radial-gradient(ellipse at center, #0a1620 0%, #020507 100%);
            border: 1px solid var(--color-panel-border);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9), 0 0 14px rgba(0,229,255,0.08);
            border-radius: 2px;
        }
        .plaque-metal {
            background: linear-gradient(135deg, #ccd6df 0%, #a6b2bf 30%, #7d8b99 60%, #4a5663 100%);
            padding: 7px;
            border-radius: 2px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            box-shadow: 4px 4px 12px rgba(0,0,0,0.8), 1px 1px 0 rgba(255,255,255,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
            border: 1px solid #2c3844;
        }
        .plaque-row { display: flex; gap: 5px; }
        .p-tile {
            width: 20px; height: 28px;
            border: 1px solid rgba(0,0,0,0.65);
            position: relative;
            box-shadow: inset 1px 1px 3px rgba(255,255,255,0.25), inset -1px -1px 2px rgba(0,0,0,0.4);
        }
        .p-tile::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(160deg, rgba(255,255,255,0.22) 0%, transparent 55%);
        }
        .p-tile-red    { background: linear-gradient(160deg, #ff3d00, #7a1c00); }
        .p-tile-cyan   { background: linear-gradient(160deg, #00e5ff, #005f6b); }
        .p-tile-amber  { background: linear-gradient(160deg, #ffb300, #7a5600); }
        .p-tile-blue   { background: linear-gradient(160deg, #4f7cff, #0d205f); }
        .p-tile-dark   { background: linear-gradient(160deg, #6b98a4, #1a2c33); }

        .code-cylinder {
            width: 10px; height: 42px;
            background: linear-gradient(90deg, #263238 0%, #b9c8ce 35%, #eaf7fa 50%, #b9c8ce 65%, #263238 100%);
            border-radius: 2px;
            position: relative;
            box-shadow: 2px 3px 6px rgba(0,0,0,0.75), inset 0 0 2px rgba(255,255,255,0.1);
        }
        .code-cylinder::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 8px;
            background: linear-gradient(180deg, #0c2336, #010203);
            border-bottom: 1px solid #000;
            border-radius: 2px 2px 0 0;
        }
        .code-cylinder::after {
            content: ''; position: absolute; top: 10px; left: 2px; right: 2px; height: 3px;
            background: var(--color-cyan);
            box-shadow: 0 0 4px var(--color-cyan);
        }
        .code-cylinder.cyl-amber::after { background: var(--color-amber); box-shadow: 0 0 4px var(--color-amber); }
        .code-cylinder.cyl-red::after { background: var(--color-red); box-shadow: 0 0 4px var(--color-red); }

        .room-btn {
            position: relative;
            text-align: left;
            padding: 10px;
            background: linear-gradient(180deg, rgba(6,17,26,0.9), rgba(3,7,11,0.9));
            border: 1px solid var(--color-panel-border);
            transition: all 0.15s ease;
        }
        .room-btn:hover {
            border-color: var(--color-cyan);
            background: rgba(0,229,255,0.06);
            box-shadow: 0 0 12px rgba(0,229,255,0.15);
        }
        .room-btn.room-alert { border-color: rgba(255,61,0,0.5); }
        .room-btn.room-alert:hover { border-color: var(--color-red); box-shadow: 0 0 12px rgba(255,61,0,0.2); }

        .redact {
            background: #000;
            color: #000;
            padding: 0 3px;
            border-radius: 1px;
            cursor: pointer;
            box-shadow: inset 0 0 0 1px #1a1a1a;
            -webkit-user-select: none;
            user-select: none;
        }
        .redact:hover { box-shadow: inset 0 0 0 1px var(--color-red); }
        @keyframes denyFlash {
            0%, 100% { box-shadow: inset 0 0 0 1px #1a1a1a; }
            50% { box-shadow: inset 0 0 0 2px var(--color-red); background: rgba(255,61,0,0.25); }
        }
        .redact.denied { animation: denyFlash 0.5s ease; }
        .doc-stamp {
            position: absolute;
            top: 14px; right: -6px;
            border: 3px solid var(--color-red);
            color: var(--color-red);
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            letter-spacing: 0.15em;
            font-size: 11px;
            padding: 4px 10px;
            transform: rotate(8deg);
            opacity: 0.85;
            text-shadow: 0 0 6px rgba(255,61,0,0.6);
            box-shadow: 0 0 10px rgba(255,61,0,0.15);
            pointer-events: none;
            z-index: 20;
        }
        .dossier-sheet {
            background: #cfcac2;
            background-image:
                repeating-linear-gradient(0deg, rgba(0,0,0,0.02) 0px, transparent 1px, transparent 2px),
                radial-gradient(circle at 20% 15%, rgba(255,255,255,0.25), transparent 60%);
            color: #17140f;
            font-family: 'Share Tech Mono', monospace;
            padding: 18px;
            position: relative;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6), inset 0 0 40px rgba(0,0,0,0.12);
            border: 1px solid #8a8377;
        }
        .dossier-sheet .redact { box-shadow: inset 0 0 0 1px #000; }
        .dossier-photo {
            width: 92px; height: 110px;
            background: #0a0a0a;
            border: 2px solid #17140f;
            display: flex; align-items: center; justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .dossier-photo::after {
            content: 'IMAGE\\A UNAVAILABLE';
            white-space: pre;
            position: absolute; bottom: 4px; left: 0; right: 0;
            text-align: center;
            font-size: 7px; letter-spacing: 0.1em;
            color: #4a4a4a;
        }
        .dossier-field-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: #55503f; }
        .dossier-field-value { font-size: 13px; font-weight: bold; color: #17140f; }

        .decrypt-panel {
            position: fixed;
            bottom: 46px; right: 12px;
            width: 240px;
            background: var(--color-panel);
            border: 1px solid var(--color-cyan-dim);
            box-shadow: 0 0 30px rgba(0,0,0,0.85);
            z-index: 10000;
            padding: 10px;
        }
        .doc-header-block {
            border: 1px solid var(--color-panel-border);
            background: rgba(255,61,0,0.04);
            padding: 8px 10px;
            margin-bottom: 14px;
            font-size: 10px;
            color: var(--color-text-dim);
        }

        .classify-badge {
            display: inline-block;
            padding: 2px 7px;
            font-size: 9px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            border: 1px solid currentColor;
            white-space: nowrap;
        }
        .classify-unclassified { color: var(--color-text-dim); }
        .classify-restricted { color: var(--color-amber); }
        .classify-level4, .classify-level5 { color: var(--color-amber); }
        .classify-omega { color: var(--color-red); background: rgba(255,61,0,0.08); }

        .precedence-badge {
            display: inline-flex; align-items: center; gap: 3px;
            padding: 2px 7px;
            font-size: 9px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            border-radius: 1px;
        }
        .precedence-routine { color: var(--color-text-dim); background: rgba(84,139,153,0.08); }
        .precedence-priority { color: var(--color-amber); background: rgba(255,179,0,0.1); }
        .precedence-flash { color: var(--color-red); background: rgba(255,61,0,0.12); animation: flicker 4s infinite linear; }

        .msg-routing-block {
            border: 1px solid var(--color-panel-border);
            background: #010304;
            padding: 10px 12px;
            position: relative;
            overflow: hidden;
        }
        .msg-routing-block::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, var(--color-cyan-dim), transparent 70%);
        }

        .attachment-chip {
            display: flex; align-items: center; gap: 8px;
            padding: 7px 10px;
            border: 1px solid var(--color-panel-border);
            background: rgba(0,229,255,0.02);
            cursor: pointer;
            font-family: 'Share Tech Mono', monospace;
            transition: all 0.15s ease;
        }
        .attachment-chip:hover { border-color: var(--color-cyan); background: rgba(0,229,255,0.07); }
        .attachment-chip.open { border-color: var(--color-cyan-dim); background: rgba(0,229,255,0.05); }

        .attachment-viewer {
            border: 1px solid var(--color-panel-border);
            border-top: none;
            background: #010304;
            padding: 10px;
        }

        .doc-sheet {
            background: #cfcac2;
            background-image:
                repeating-linear-gradient(0deg, rgba(0,0,0,0.02) 0px, transparent 1px, transparent 2px),
                radial-gradient(circle at 20% 15%, rgba(255,255,255,0.25), transparent 60%);
            color: #17140f;
            font-family: 'Share Tech Mono', monospace;
            padding: 16px;
            position: relative;
            box-shadow: 0 6px 24px rgba(0,0,0,0.6), inset 0 0 40px rgba(0,0,0,0.12);
            border: 1px solid #8a8377;
        }
        .doc-sheet .redact { box-shadow: inset 0 0 0 1px #000; }
        .doc-sheet-header {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding-bottom: 10px;
            margin-bottom: 12px;
            border-bottom: 2px solid #17140f;
        }
        .doc-sheet-field-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: #55503f; }
        .doc-sheet-field-value { font-size: 12px; font-weight: bold; color: #17140f; word-break: break-word; }
        .doc-sheet-body { font-size: 12px; line-height: 1.6; }
        .doc-sheet-footer {
            margin-top: 14px;
            padding-top: 8px;
            border-top: 1px solid #8a8377;
            font-size: 9px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #55503f;
            text-align: center;
        }
        @media (max-width: 767px) {
            .doc-sheet-header { grid-template-columns: 1fr 1fr; }
        }

        .subtitle-line { opacity: 0; animation: subtitleIn 0.4s ease forwards; }
        @keyframes subtitleIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cassette-unit { display: flex; flex-direction: column; gap: 10px; }
        .cassette-shell {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            display: block;
        }
        .cassette-reel-group { transform-origin: center; transform-box: fill-box; }
        .cassette-shell.is-playing .cassette-reel-group {
            animation: cassetteSpin 2.4s linear infinite;
        }
        @keyframes cassetteSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .cassette-frame { fill: var(--color-panel); stroke: var(--color-cyan-dim); stroke-width: 2; }
        .cassette-window { fill: #010405; stroke: var(--color-panel-border); stroke-width: 1.5; }
        .cassette-hub { fill: var(--color-bg); stroke: var(--color-cyan-dim); stroke-width: 1.5; }
        .cassette-spoke { stroke: var(--color-cyan-dim); stroke-width: 2; opacity: 0.55; }
        .cassette-shell.is-playing .cassette-hub { stroke: var(--color-cyan); }
        .cassette-shell.is-playing .cassette-spoke { stroke: var(--color-cyan); opacity: 0.9; }
        .cassette-screw { fill: var(--color-bg); stroke: var(--color-panel-border); stroke-width: 1; }
        .cassette-tape-path { stroke: var(--color-cyan-dim); stroke-width: 1; fill: none; opacity: 0.35; }
        .cassette-label-line { stroke: var(--color-panel-border); stroke-width: 1; }
        .cassette-tick { fill: var(--color-cyan-dim); }

        
        .decode-line { opacity: 1; }
        .decode-line-current { color: #fff; text-shadow: 0 0 6px rgba(0,229,255,0.5); }
        .type-cursor {
            display: inline-block;
            margin-left: 1px;
            animation: cursorBlink 0.9s steps(1) infinite;
        }
        @keyframes cursorBlink { 50% { opacity: 0; } }
        .cassette-waiting { animation: pulse-cyan 1.4s ease-in-out infinite; }
        .cassette-lock-bar {
            height: 11px;
            background: #000;
            box-shadow: inset 0 0 0 1px #1a1a1a;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }
        .cassette-lock-bar:hover { box-shadow: inset 0 0 0 1px var(--color-red); }
        .cassette-lock-bar.denied { animation: denyFlash 0.5s ease; }
        .cassette-log-box {
            
            scroll-behavior: auto;
            -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14px, #000 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 14px, #000 100%);
        }

        
        .waveform-bar {
            transform-origin: bottom center;
            transition: height 0.2s ease;
        }
        .waveform-bar.is-live {
            animation-name: waveformPulse;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
        }
        @keyframes waveformPulse {
            0%   { transform: scaleY(0.55); opacity: 0.45; }
            50%  { transform: scaleY(1.18); opacity: 0.95; }
            100% { transform: scaleY(0.55); opacity: 0.45; }
        }
        .anomaly-nav-btn {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 10px;
            border-left: 3px solid transparent;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .anomaly-nav-btn:hover { background: #0a151f; border-left-color: var(--color-cyan-dim); }
        .anomaly-nav-btn.active { background: var(--color-panel-border); border-left-color: var(--color-cyan); }
        .an-badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 8px;
            font-size: 9px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            border: 1px solid currentColor;
            white-space: nowrap;
        }
        .an-prose { font-size: 12.5px; line-height: 1.75; color: var(--color-text-dim); }
        .an-prose strong { color: #fff; }
        .an-section-title {
            font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
            color: var(--color-amber); font-weight: bold;
            border-bottom: 1px solid var(--color-panel-border);
            padding-bottom: 6px; margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }

        @media (max-width: 767px) {
            .window {
                border-width: 1px;
                left: 0 !important; top: 0 !important;
                width: 100% !important; height: calc(100% - 40px) !important;
            }

        const win = state.windows.find(w => w.id === id);
        if (win && win.zIndex < state.highestZ) {
            state.highestZ++;
            win.zIndex = state.highestZ;
            update();
        }
    }

    function isMobileViewport() {
        return window.innerWidth < 768;
    }

    function toggleWindow(id) {
        const win = state.windows.find(w => w.id === id);
        if (win) {
            win.open = !win.open;
            if (!win.open && id === 'anomaly-an5001') stopAllCassettes();
            if (win.open && isMobileViewport()) win.maximized = true;
            if (win.open) bringToFront(id);
            else update();
        }
    }

    document.addEventListener('mousemove', (e) => {
        if (state.resizeState) {
            const win = state.windows.find(w => w.id === state.resizeState.id);
            if (!win || win.maximized) return;
            const dx = e.clientX - state.resizeState.startX;
            const dy = e.clientY - state.resizeState.startY;
            const el = document.getElementById(`win-${win.id}`);
            if (el) {
                win.w = Math.max(340, state.resizeState.initW + dx);
                win.h = Math.max(240, state.resizeState.initH + dy);
                el.style.width = `${win.w}px`;
                el.style.height = `${win.h}px`;
            }
            return;
        }
        if (!state.dragState) return;
        const win = state.windows.find(w => w.id === state.dragState.id);
        if (!win || win.maximized) return;

        const dx = e.clientX - state.dragState.startX;
        const dy = e.clientY - state.dragState.startY;
        
        const el = document.getElementById(`win-${win.id}`);
        if (el) {
            win.x = Math.max(0, state.dragState.initWinX + dx);
            win.y = Math.max(0, state.dragState.initWinY + dy);
            el.style.left = `${win.x}px`;
            el.style.top = `${win.y}px`;
        }
    });

    document.addEventListener('mouseup', () => {
        if (state.dragState) state.dragState = null;
        if (state.resizeState) state.resizeState = null;
    });

    window.startDrag = function(e, id) {
        if (e.target.closest('.win-controls')) return;
        bringToFront(id);
        if (isMobileViewport()) return;
        const win = state.windows.find(w => w.id === id);
        if (win.maximized) return;
        state.dragState = { id, startX: e.clientX, startY: e.clientY, initWinX: win.x, initWinY: win.y };
    };

    window.startResize = function(e, id) {
        e.stopPropagation();
        e.preventDefault();
        if (isMobileViewport()) return;
        bringToFront(id);
        const win = state.windows.find(w => w.id === id);
        if (!win || win.maximized) return;
        state.resizeState = { id, startX: e.clientX, startY: e.clientY, initW: win.w, initH: win.h };
    };

    function renderPlaque(rank, scale) {
        const tileHtml = (colors) => colors.map(c => `<div class="p-tile p-tile-${c}"></div>`).join('');
        const cylCount = rank.cylinders || 0;
        const cylLeft = Math.ceil(cylCount / 2);
        const cylRight = Math.floor(cylCount / 2);
        const cylClass = rank.tier === 1 ? 'cyl-red' : (rank.tier <= 4 ? '' : 'cyl-amber');
        const cylHtml = (n) => Array(n).fill(`<div class="code-cylinder ${cylClass}"></div>`).join('');
        const tileCount = Math.max((rank.plaqueTop || []).length, (rank.plaqueBottom || []).length);
        const approxWidth = (tileCount * 25) + (cylCount * 15) + 60;
        const maxScale = scale || 1;
        const fitScale = Math.min(maxScale, 260 / approxWidth) ;
        const finalScale = Math.max(0.55, Math.min(maxScale, fitScale));
        const scaleStyle = `transform: scale(${finalScale.toFixed(2)}); transform-origin: left center;`;

        if (!rank.plaqueTop || rank.plaqueTop.length === 0) {
            return `<div class="text-[9px] text-[var(--color-text-dim)] italic border border-dashed border-[var(--color-panel-border)] px-3 py-2 text-center">NO INSIGNIA<br/>AUTHORIZED</div>`;
        }

        return `
            <div class="plaque-container" style="${scaleStyle}">
                <div class="flex gap-1">${cylHtml(cylLeft)}</div>
                <div class="plaque-metal">
                    <div class="plaque-row">${tileHtml(rank.plaqueTop)}</div>
                    ${rank.plaqueBottom && rank.plaqueBottom.length ? `<div class="plaque-row">${tileHtml(rank.plaqueBottom)}</div>` : ''}
                </div>
                <div class="flex gap-1">${cylHtml(cylRight)}</div>
            </div>`;
    }

    function waveformBars(seed, count, isLive) {
        let bars = '';
        for (let i = 0; i < count; i++) {
            const h = 18 + Math.abs(Math.sin(seed * 0.013 + i * 0.7) + Math.sin(seed * 0.05 + i * 0.31)) * 42;
            let style = `height:${h.toFixed(0)}%; width:3px; background:var(--color-cyan-dim); opacity:0.55; flex-shrink:0;`;
            let cls = 'waveform-bar';
            if (isLive) {
                cls += ' is-live';
                const dur = (0.45 + Math.random() * 0.65).toFixed(2);
                const delay = (-(Math.random() * dur)).toFixed(2);
                style += ` animation-duration:${dur}s; animation-delay:${delay}s;`;
            }
            bars += `<div class="${cls}" style="${style}"></div>`;
        }
        return bars;
    }

        const ticks = Array.from({ length: 14 }).map((_, i) => `<circle class="cassette-tick" cx="${58 + i * 14}" cy="164" r="1.6"></circle>`).join('');

    function renderAudioLog(logId, opts) {

        }).join('');

        const statusLabel = isPlaying ? 'PLAYING' : (finished ? 'STOPPED' : (started ? 'PAUSED' : 'STOPPED'));

        return `

    const AN5001_AUDIO_ID = 'an5001-log-4';
    const AN5001_SOURCE_FILE = 'audio/The Chordettes Lollipop (Featured In The Movie SMILE) (Remastered).mp3';
    let an5001Ctx = null, an5001Master = null, an5001Analyser = null, an5001RadioGain = null;
    let an5001Nodes = [];
    let an5001RafId = null, an5001GlitchTimer = null, an5001BeepTimer = null;
    let an5001SourceBuffer = null;

    function an5001MakeNoiseBuffer(ctx, seconds) {
        const len = Math.floor(ctx.sampleRate * seconds);
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        return buf;
    }

    function an5001DistortionCurve(amount) {
        const n = 4096;
        const curve = new Float32Array(n);
        for (let i = 0; i < n; i++) {
            const x = i * 2 / n - 1;
            curve[i] = (1 + amount) * x / (1 + amount * Math.abs(x));
        }
        return curve;
    }

    async function an5001LoadSourceBuffer(ctx) {
        if (an5001SourceBuffer) return an5001SourceBuffer;
        const resp = await fetch(AN5001_SOURCE_FILE);
        const arrayBuffer = await resp.arrayBuffer();
        an5001SourceBuffer = await ctx.decodeAudioData(arrayBuffer);
        return an5001SourceBuffer;
    }

    async function an5001BuildGraph(ctx) {
        const master = ctx.createGain();
        master.gain.value = 0;
        master.connect(ctx.destination);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 256;
        master.connect(analyser);
        const now = ctx.currentTime;
        const nodes = [];

        const wow = ctx.createOscillator(); wow.type = 'sine'; wow.frequency.value = 0.27;
        const wowGain = ctx.createGain(); wowGain.gain.value = 17;
        wow.connect(wowGain);
        const flutter = ctx.createOscillator(); flutter.type = 'sine'; flutter.frequency.value = 6.1;
        const flutterGain = ctx.createGain(); flutterGain.gain.value = 5;
        flutter.connect(flutterGain);
        wow.start(now); flutter.start(now);
        nodes.push(wow, flutter);

        const vocalBus = ctx.createGain(); vocalBus.gain.value = 0.9;
        const vocalFilter = ctx.createBiquadFilter();
        vocalFilter.type = 'bandpass'; vocalFilter.frequency.value = 1250; vocalFilter.Q.value = 1.1;
        const shaper = ctx.createWaveShaper();
        shaper.curve = an5001DistortionCurve(4); shaper.oversample = '2x';

        const buffer = await an5001LoadSourceBuffer(ctx);
        const src = ctx.createBufferSource();
        src.buffer = buffer;
        src.loop = true;
        wowGain.connect(src.detune);
        flutterGain.connect(src.detune);
        src.connect(vocalBus);
        src.start(now);
        nodes.push(src);

        vocalBus.connect(vocalFilter); vocalFilter.connect(shaper); shaper.connect(master);

        const filterLFO = ctx.createOscillator(); filterLFO.type = 'sine'; filterLFO.frequency.value = 0.05;
        const filterLFOGain = ctx.createGain(); filterLFOGain.gain.value = 450;
        filterLFO.connect(filterLFOGain); filterLFOGain.connect(vocalFilter.frequency);
        filterLFO.start(now);
        nodes.push(filterLFO);

        const hissSrc = ctx.createBufferSource();
        hissSrc.buffer = an5001MakeNoiseBuffer(ctx, 2); hissSrc.loop = true;
        const hissFilter = ctx.createBiquadFilter(); hissFilter.type = 'highpass'; hissFilter.frequency.value = 4000;
        const hissGain = ctx.createGain(); hissGain.gain.value = 0.02;
        hissSrc.connect(hissFilter); hissFilter.connect(hissGain); hissGain.connect(master);
        hissSrc.start(now);
        nodes.push(hissSrc);

        const hum1 = ctx.createOscillator(); hum1.type = 'sine'; hum1.frequency.value = 60;
        const humGain1 = ctx.createGain(); humGain1.gain.value = 0.018;
        hum1.connect(humGain1); humGain1.connect(master); hum1.start(now);
        nodes.push(hum1);

        const radioSrc = ctx.createBufferSource();
        radioSrc.buffer = an5001MakeNoiseBuffer(ctx, 2); radioSrc.loop = true;
        const radioFilter = ctx.createBiquadFilter(); radioFilter.type = 'bandpass'; radioFilter.Q.value = 8; radioFilter.frequency.value = 1000;
        const radioGain = ctx.createGain(); radioGain.gain.value = 0.035;
        const radioLFO = ctx.createOscillator(); radioLFO.type = 'sine'; radioLFO.frequency.value = 0.08;
        const radioLFOGain = ctx.createGain(); radioLFOGain.gain.value = 850;
        radioLFO.connect(radioLFOGain); radioLFOGain.connect(radioFilter.frequency);
        radioSrc.connect(radioFilter); radioFilter.connect(radioGain); radioGain.connect(master);
        radioSrc.start(now); radioLFO.start(now);
        nodes.push(radioSrc, radioLFO);

        return { master, analyser, nodes, radioGain };
    }

    function an5001SetInterference(active) {
        const el = document.getElementById(AN5001_AUDIO_ID + '-interference');
        if (el) el.textContent = active ? '\u26a1 SIGNAL INTERFERENCE - AUDIO DEGRADED' : '';
        const label = document.getElementById(AN5001_AUDIO_ID + '-statuslabel');
        if (label) label.textContent = active ? 'INTERFERENCE' : 'PLAYING';
    }

    function an5001ScheduleGlitch() {
        if (!an5001Ctx) return;
        const delay = 2400 + Math.random() * 3800;
        an5001GlitchTimer = setTimeout(() => {
            if (!an5001Ctx || !an5001Master) return;
            const now = an5001Ctx.currentTime;
            const dropDepth = 0.35 + Math.random() * 0.6;
            const dur = 0.12 + Math.random() * 0.5;
            const base = an5001Master.gain.value;
            an5001SetInterference(true);
            an5001Master.gain.cancelScheduledValues(now);
            an5001Master.gain.setValueAtTime(base, now);
            an5001Master.gain.linearRampToValueAtTime(base * (1 - dropDepth), now + dur * 0.3);
            an5001Master.gain.linearRampToValueAtTime(base, now + dur);
            if (an5001RadioGain) {
                const rBase = an5001RadioGain.gain.value;
                an5001RadioGain.gain.cancelScheduledValues(now);
                an5001RadioGain.gain.setValueAtTime(rBase, now);
                an5001RadioGain.gain.linearRampToValueAtTime(rBase * 3.5, now + dur * 0.3);
                an5001RadioGain.gain.linearRampToValueAtTime(rBase, now + dur + 0.1);
            }
            setTimeout(() => an5001SetInterference(false), dur * 1000 + 120);
            an5001ScheduleGlitch();
        }, delay);
    }

    function an5001ScheduleBeep() {
        if (!an5001Ctx) return;
        const delay = 3500 + Math.random() * 5000;
        an5001BeepTimer = setTimeout(() => {
            if (!an5001Ctx || !an5001Master) return;
            const now = an5001Ctx.currentTime;
            const osc = an5001Ctx.createOscillator();
            osc.type = 'sine'; osc.frequency.value = 650 + Math.random() * 900;
            const g = an5001Ctx.createGain();
            g.gain.setValueAtTime(0, now);
            g.gain.linearRampToValueAtTime(0.045, now + 0.008);
            g.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
            osc.connect(g); g.connect(an5001Master);
            osc.start(now); osc.stop(now + 0.2);
            an5001ScheduleBeep();
        }, delay);
    }

    function an5001Draw() {
        const canvas = document.getElementById(AN5001_AUDIO_ID + '-canvas');
        if (canvas) {
            const c = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            c.fillStyle = '#000'; c.fillRect(0, 0, w, h);
            if (an5001Analyser) {
                const data = new Uint8Array(an5001Analyser.frequencyBinCount);
                an5001Analyser.getByteFrequencyData(data);
                const barCount = Math.min(48, data.length);
                const barW = w / barCount;
                for (let i = 0; i < barCount; i++) {
                    const v = data[i] / 255;
                    const bh = Math.max(1, v * h);
                    c.fillStyle = i % 6 === 0 ? '#ffb300' : '#00e5ff';
                    c.globalAlpha = 0.9;
                    c.fillRect(i * barW, h - bh, Math.max(1, barW - 1), bh);
                }
                c.globalAlpha = 1;
            }
        }
        an5001RafId = requestAnimationFrame(an5001Draw);
    }

    async function an5001Start() {
        if (!an5001Ctx) an5001Ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (an5001Ctx.state === 'suspended') an5001Ctx.resume();
        an5001Stop(true);
        const built = await an5001BuildGraph(an5001Ctx);
        an5001Master = built.master;
        an5001Analyser = built.analyser;
        an5001Nodes = built.nodes;
        an5001RadioGain = built.radioGain;

        const now = an5001Ctx.currentTime;
        an5001Master.gain.cancelScheduledValues(now);
        an5001Master.gain.setValueAtTime(0.0001, now);
        an5001Master.gain.exponentialRampToValueAtTime(0.5, now + 1.1);

        an5001ScheduleBeep();
        an5001ScheduleGlitch();
        if (!an5001RafId) an5001Draw();
    }

    function an5001Stop(silent) {
        clearTimeout(an5001GlitchTimer);
        clearTimeout(an5001BeepTimer);
        const ctx = an5001Ctx, master = an5001Master, nodesToKill = an5001Nodes;
        if (master && ctx) {
            const now = ctx.currentTime;
            try {
                master.gain.cancelScheduledValues(now);
                master.gain.setValueAtTime(master.gain.value, now);
                master.gain.exponentialRampToValueAtTime(0.0001, now + (silent ? 0.01 : 0.4));
            } catch (e) {}
        }
        an5001Master = null;
        an5001RadioGain = null;
        an5001Nodes = [];
        if (!silent) {
            an5001SetInterference(false);
            setTimeout(() => { an5001Analyser = null; }, 450);
        }
        setTimeout(() => {
            nodesToKill.forEach(n => { try { n.stop && n.stop(); } catch (e) {} });
        }, silent ? 20 : 450);
    }

    window.toggleNorthstarAudioLog = function(id) {

        toggleAnomalyLog(id);
        const isPlayingNow = !!state.anomalyLogsOpen[id];

        if (!isPlayingNow && wasPlaying) an5001Stop(false);
    };

    function anSectionEntry() {
        return `
        <div class="doc-sheet mb-4" style="max-width:none;">
            <div class="doc-stamp">CLASS 5</div>
            <div class="doc-sheet-header" style="grid-template-columns: repeat(4, 1fr);">
                <div><div class="doc-sheet-field-label">Designation</div><div class="doc-sheet-field-value">AN-5-001</div></div>
                <div><div class="doc-sheet-field-label">Form</div><div class="doc-sheet-field-value">Object / Vessel</div></div>
                <div><div class="doc-sheet-field-label">Availability</div><div class="doc-sheet-field-value">Unique</div></div>
                <div><div class="doc-sheet-field-label">Control</div><div class="doc-sheet-field-value">Conditional / Uncontrolled</div></div>
            </div>
            <div class="doc-sheet-body">
                <p style="margin-bottom:10px;"><strong>Description:</strong> NORTHSTAR is an anomalous research vessel approximately 118 meters in length, originally constructed and operated by the Commission during the final decades of the Masquerade. Hull configuration is unlike any other recovered Commission asset - icebreaker-rated below the waterline, but carrying superstructure and mast arrays with no conventional maritime function, consistent with a platform built to remain stationary near a Rift for extended periods rather than to travel far. The vessel was designed for long-duration Arctic and Rift research expeditions. It was rediscovered beneath approximately 2.7 kilometers of ice in northern Greenland in August 2032, inside a large underground cavern alongside anomalous structures and materials. No crew, bodies, creatures, or other biological remains were found aboard. Several sealed containers of anomalous, non-biological material were recovered from the vessel's forward laboratory and cargo hold; composition and origin remain under review by Materials Science. Several laboratories, living quarters, navigation systems, and experimental systems remain intact, and - against every expectation for a vessel presumed sealed for two decades or more - a portion of those systems are still drawing power. See Section III, Interior Survey. The vessel was recovered only days ago and was transferred to Meridian Headquarters within the week; the great majority of its systems, compartments, and recovered material remain unexamined.</p>
                <p style="margin-bottom:10px;"><strong>Anomalous Properties:</strong> NORTHSTAR was constructed around experimental Commission technology designed to study and interact with Rifts. Its primary system, informally designated the Transit Core, appears capable of temporarily altering local spatial conditions and interacting with Rift boundaries. The vessel can detect certain Rift manifestations at considerable distances and has demonstrated limited effects on the geometry of its internal spaces, including at least one confirmed interior compartment in which measured internal volume does not match the compartment's exterior hull dimensions by <span class="redact" onclick="revealRedact(this)">roughly eleven percent, a discrepancy Materials Science has so far only been able to reproduce, in miniature, inside an active Rift boundary</span>. The full purpose of the Transit Core remains unknown. The technology appears considerably more advanced than most surviving Commission equipment, and Meridian Systems has noted design philosophy overlaps with the Directorate's own photonic computing line that predate any known contact between the two research traditions.</p>
                <p style="margin-bottom:10px;"><strong>Limitations:</strong> The Transit Core cannot currently be reliably activated or controlled. NORTHSTAR cannot currently be used for deliberate inter-reality travel, and the Meridian has been unable to reproduce its technology. The vessel's anomalous systems appear to require specific conditions that researchers have not yet identified. A single compartment adjoining the Core remains outside safe operating temperature range for reasons unrelated to the ambient cold of its burial; see Section III.</p>
                <p style="margin-bottom:10px;"><strong>Access:</strong> The Meridian possesses the entire vessel. It was recently transported from northern Greenland to Meridian Headquarters beneath Streymoy, Faroe Islands, where it is being studied. Physical access to the vessel proper is limited to Historical Archives, Meridian Systems diagnostic staff, and Council-designated observers; the Transit Core compartment specifically requires a second, separate authorization <span class="redact" onclick="revealRedact(this)">that as of this filing only three living Directorate personnel hold</span>.</p>
                <p style="margin-bottom:10px;"><strong>Origin:</strong> NORTHSTAR was constructed by the Commission as part of a classified research program investigating long-duration Rifts and the possibility of using anomalous spatial phenomena for transportation and exploration. The vessel was deployed to the Arctic sometime before Disclosure. Its final known Commission records indicate that it was operating in northern Greenland shortly before the Brooklyn Exposure of 2007. The vessel subsequently disappeared from Commission records. Its crew and the circumstances surrounding its disappearance remain unknown.</p>
                <p style="margin-bottom:10px;"><strong>Current Status:</strong> Contained and under active study at Meridian Headquarters. The Meridian only recently recovered NORTHSTAR and has begun comparing its systems with surviving Commission archives.</p>
                <p style="margin:0;"><strong>Additional Lore:</strong> NORTHSTAR is one of the most significant surviving pieces of Commission technology recovered since the Culling. The Meridian believes the vessel belonged to a research program that was deliberately kept separate from the Commission's primary anomaly registry. Several recovered systems appear to reference research conducted before Disclosure into the relationship between Rifts and physical space. The vessel's navigation systems also contain references to several historical Rift events believed lost with the Commission. Whatever happened to its original crew remains unknown, and the Directorate has not ruled out the possibility that the Commission abandoned the vessel deliberately.</p>
            </div>
            <div class="doc-sheet-footer">AN-5-001 // Historical Archives Division // Distribution restricted to Level 5 clearance and above</div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div class="tech-border bg-[var(--color-panel)] p-3"><div class="text-[9px] text-[var(--color-cyan-dim)] uppercase tracking-widest mb-1">Class</div><div class="text-sm font-bold text-[var(--color-amber)]">5 - National</div></div>
            <div class="tech-border bg-[var(--color-panel)] p-3"><div class="text-[9px] text-[var(--color-cyan-dim)] uppercase tracking-widest mb-1">Recovery</div><div class="text-sm font-bold text-white">Greenland, 2032</div></div>
            <div class="tech-border bg-[var(--color-panel)] p-3"><div class="text-[9px] text-[var(--color-cyan-dim)] uppercase tracking-widest mb-1">Location</div><div class="text-sm font-bold text-white">Streymoy HQ</div></div>
            <div class="tech-border bg-[var(--color-panel)] p-3"><div class="text-[9px] text-[var(--color-cyan-dim)] uppercase tracking-widest mb-1">Status</div><div class="text-sm font-bold text-[var(--color-cyan)]">Active Research</div></div>
        </div>
        <div class="tech-border bg-[var(--color-panel)] p-3 mt-3 flex items-center gap-3">
            <i data-lucide="image-off" class="w-8 h-8 text-[var(--color-panel-border)] shrink-0"></i>
            <div class="text-[10px] text-[var(--color-text-dim)]">PHOTOGRAPHIC DOCUMENTATION: PENDING. Expedition imaging team clearance for hull and interior photography is pending Council review; recovered helmet-camera stills remain restricted to Historical Archives pending redaction pass.</div>
        </div>
        <div class="tech-border bg-[var(--color-panel)] p-3 mt-3 flex items-center gap-3 border-[var(--color-red)]">
            <i data-lucide="lock" class="w-8 h-8 text-[var(--color-red)] shrink-0"></i>
            <div class="text-[10px] text-[var(--color-text-dim)]">FULL TRANSIT CORE SCHEMATIC AND ACTIVATION LOG: SEALED BY COUNCIL ORDER. <span class="redact" onclick="revealRedact(this)">Not releasable to this terminal at any clearance level currently held by Historical Archives staff.</span></div>
        </div>`;
    }

    function anSectionHistory() {
        return `
        <div class="an-section-title"><i data-lucide="book-open" class="w-4 h-4"></i> I. Historical Record</div>
        <div class="an-prose flex flex-col gap-3">
            <p>NORTHSTAR was constructed by the <strong>Commission</strong> during the latter period of the Masquerade. Surviving records indicate that it belonged to a classified research program investigating <strong>long-duration Rifts</strong>, particularly those occurring in remote environments.</p>
            <p>Unlike conventional Commission facilities, NORTHSTAR was designed to operate independently for extended periods. The vessel was equipped with laboratories, anomalous-material storage, Rift detection systems, experimental computing equipment, and a prototype system capable of interacting with Rift boundaries.</p>
            <p>The program appears to have been highly compartmentalized. Even within the Commission, relatively few personnel appear to have known of the vessel. Cross-referencing against recovered personnel rosters has so far identified no more than a dozen names with any plausible connection to the program, and none of those individuals appear in any surviving post-2007 record. One name recurs across all three surviving documents in a supervisory capacity: <span class="redact" onclick="revealRedact(this)">a Commission program director referred to only by the initials E.H., never a full name, cross-referenced against zero known Commission personnel files recovered to date</span>.</p>
            <p>The last confirmed Commission communication with NORTHSTAR occurred prior to the <strong>Brooklyn Exposure of 2007</strong>. No subsequent communication was recorded.</p>
            <p>During the <strong>Thirty-Six Days</strong>, Commission facilities were seized, personnel disappeared, archives were destroyed or confiscated, and large portions of the organization's infrastructure collapsed. NORTHSTAR was listed as <strong>MISSING</strong> in one surviving Commission logistics record. It was later removed from several versions of the registry. The reason is unknown.</p>
        </div>`;
    }

    function anSectionDiscovery() {
        return `
        <div class="an-section-title"><i data-lucide="search" class="w-4 h-4"></i> II. Discovery</div>
        <div class="an-prose flex flex-col gap-3">
            <p>On <strong>8 August 2032</strong>, Meridian North Atlantic monitoring systems detected an anomalous geological signature beneath northern Greenland. The initial investigation was classified as a routine Rift survey, part of the standing effort to catalogue long-duration manifestations across the North Atlantic basin.</p>
            <p>At approximately 2.7 kilometers beneath the ice, the expedition discovered an artificial cavern. Inside was NORTHSTAR.</p>
            <p>The vessel was partially surrounded by crystalline deposits and unidentified metallic structures, consistent in composition with materials the Materials Science division has previously catalogued as Rift-adjacent, though notably absent of any active Rift signature. No Rift large enough to accommodate the vessel was present at the time of discovery, nor is there any geological evidence - cavern deformation, melt-refreeze striation, structural scarring - consistent with one having been present recently.</p>
            <p>No impact damage was observed. No crew, creatures, or biological remains were found. Several sealed containers of anomalous, non-biological material were recovered from within the vessel itself, separate from the crystalline deposits and metallic structures noted in the surrounding cavern.</p>
            <p>The vessel was subsequently identified through comparison with recovered Commission records. The name appeared in only three surviving documents. All three had been classified <strong>BLACK / COMMISSION INTERNAL</strong>.</p>
            <p>Follow-up ice-core dating of the surrounding formation places the cavern's sealed condition at a minimum of two decades prior to discovery, and Materials Science has not ruled out a considerably longer figure pending isotope analysis. The current working hypothesis - unconfirmed - is that the cavern was not a natural void the vessel later occupied, but was shaped around the vessel by some process not yet understood.</p>
            <p>The initial boarding team's first readings inside the hull did not match a vessel that had sat dead and unpowered under the ice for two decades. Instrument findings from that entry are detailed separately in Section III, Interior Survey.</p>
        </div>`;
    }

    function anSectionEnvironmental() {
        return `
        <div class="an-section-title"><i data-lucide="snowflake" class="w-4 h-4"></i> III. Interior Survey - Environmental Anomalies</div>
        <div class="an-prose flex flex-col gap-3">
            <p>Prior to any detailed research pass, the initial boarding team logged a set of interior readings that Meridian Systems has classified as anomalous in their own right, independent of any confirmed Transit Core activity. This section summarizes those findings for researchers who do not require the full instrument logs.</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div class="tech-border bg-[var(--color-panel)] p-3">
                    <div class="text-[10px] text-[var(--color-cyan)] uppercase tracking-widest mb-2 flex items-center gap-1.5"><i data-lucide="battery" class="w-3 h-3"></i> Residual Power</div>
                    <p class="text-xs text-[var(--color-text-dim)] leading-relaxed">Roughly forty percent of interior lighting circuits and the entirety of the Transit Core compartment's systems register a live power draw from a source Meridian Systems has not yet identified. The vessel's conventional reactor plant is confirmed cold and has been for a considerable period. Whatever is feeding the Core compartment is not on the same grid as the rest of the ship.</p>
                </div>
                <div class="tech-border bg-[var(--color-panel)] p-3">
                    <div class="text-[10px] text-[var(--color-cyan)] uppercase tracking-widest mb-2 flex items-center gap-1.5"><i data-lucide="thermometer" class="w-3 h-3"></i> Localized Cold</div>
                    <p class="text-xs text-[var(--color-text-dim)] leading-relaxed">The corridor immediately outside the Transit Core bulkhead runs measurably colder than every other compartment aboard, including sections with no heating at all. The gradient is not gradual - it begins abruptly at a bulkhead seam roughly four meters from the door and has held constant across eleven separate readings taken since arrival at Streymoy.</p>
                </div>
                <div class="tech-border bg-[var(--color-panel)] p-3">
                    <div class="text-[10px] text-[var(--color-amber)] uppercase tracking-widest mb-2 flex items-center gap-1.5"><i data-lucide="droplet" class="w-3 h-3"></i> Suspended Condensation</div>
                    <p class="text-xs text-[var(--color-text-dim)] leading-relaxed">Helmet-camera footage from the second interior recording (Section V) shows several droplets of condensation on a corridor pipe run that do not fall, drip, or visibly evaporate across eleven minutes of continuous recording. Materials Science has reviewed the footage frame by frame and cannot rule out a recording artifact, but has also been unable to reproduce one.</p>
                </div>
                <div class="tech-border bg-[var(--color-panel)] p-3">
                    <div class="text-[10px] text-[var(--color-amber)] uppercase tracking-widest mb-2 flex items-center gap-1.5"><i data-lucide="volume-x" class="w-3 h-3"></i> Acoustic Dampening</div>
                    <p class="text-xs text-[var(--color-text-dim)] leading-relaxed">Sound recorded within roughly ten meters of the Transit Core bulkhead is measurably quieter than the same equipment records elsewhere aboard, independent of any deliberate soundproofing in the original construction. Boarding personnel have independently described the same stretch of corridor, unprompted, as feeling like it is "holding its breath."</p>
                </div>
            </div>
            <p class="mt-1">None of the above has been confirmed as an effect of the Transit Core specifically. Meridian Systems' working assumption is that they are related, given their concentration around the same compartment, but the Core itself remains sealed and unpowered by any means the Directorate has authorized, which leaves the actual mechanism for all four effects officially unexplained.</p>
        </div>`;
    }

    function anSectionRecovery() {
        return `
        <div class="an-section-title"><i data-lucide="truck" class="w-4 h-4"></i> IV. Recovery Log</div>
        <div class="an-prose flex flex-col gap-3">
            <p><strong>Date:</strong> 12–14 August 2032</p>
            <p>The Meridian Expeditionary Division spent approximately forty hours preparing NORTHSTAR for extraction. The vessel could not be dismantled without risking damage to its anomalous systems. A specialized transport operation was therefore conducted. The Transit Core compartment was not powered down, isolated, or otherwise interfered with prior to transport; it was moved exactly as found.</p>
            <p>NORTHSTAR was extracted from the Greenland cavern and transported across the North Atlantic under Meridian cover, routed through the Iceland Station staging point to avoid a single direct transit leg that External Operations judged too difficult to cover convincingly on short notice. It arrived at the Faroe Islands on <strong>14 August 2032</strong>. <span class="redact" onclick="revealRedact(this)">The cover story presented to the two civilian shipping contractors briefly involved in the Iceland leg identified the cargo as decommissioned oceanographic survey equipment; both contractors have since been quietly moved to unrelated Meridian-front contracts</span>.</p>
            <p>The vessel was transferred directly into a newly constructed subterranean research chamber beneath Meridian Headquarters, excavated and reinforced in the seventy-two hours between the Greenland discovery and the vessel's arrival - an engineering effort External Operations has since flagged internally as one of the more difficult covers the division has maintained, requiring the temporary rerouting of two front-organization drilling contracts to explain the equipment movement.</p>
            <p class="text-[var(--color-amber)]">No external organization has been informed of the recovery.</p>
        </div>`;
    }

    function anSectionRecording() {

        const log2 = renderAudioLog('an5001-log-2', {
            title: 'Second Interior Recording',
            subtitle: 'Expedition Helmet Camera - A. Mora, Deck 2, Crew Quarters',

            lines: [
                { time: '00:00', text: '[Hatch cycles open with a hydraulic groan, then a hard metallic clang - hinge unused for years, not decades of neglect.]' },
                { time: '00:02', text: '[Interior lighting non-functional. Helmet lamp only. Boots on decking, steady, deliberate pace.]' },
                { time: '00:05', speaker: 'MORA', text: 'Doors are all open down here. Every one of them.' },
                { time: '00:10', speaker: 'VINTER', text: '[over radio, slight static] Forced, or just open?' },

                { time: '00:29', speaker: 'MORA', text: "Second one. There's a cup on this table. It's not spilled, it's not even - hang on." },

                { time: '00:35', text: "[Pause. Faint structural creak, low frequency, unexplained. Mora's breathing audibly changes.]" },
                { time: '00:38', speaker: 'MORA', text: 'Did you hear that?' },

        return `
        <div class="an-section-title"><i data-lucide="mic" class="w-4 h-4"></i> V. Interior Recordings</div>
        <div class="an-prose">
            <p><strong>Source:</strong> Expedition Helmet Camera &bull; <strong>Date:</strong> 08/08/2032</p>
            <p class="mt-2">Three segments of helmet-camera footage from the initial Greenland entry have been recovered. Two have been fully transcribed and cleared for Level 5 review. Audio and video quality across all three is degraded in places by interference consistent with the crystalline deposits surrounding the cavern; Meridian Systems has not been able to fully account for the interference pattern, nor for why it appears to intensify specifically in proximity to the Transit Core bulkhead. Transcripts below are subtitle-synchronized to the recovered timecode where legible.</p>

    function anSectionArchives() {
        return `
        <div class="an-section-title"><i data-lucide="archive" class="w-4 h-4"></i> VI. Historical Archives Report</div>
        <div class="an-prose flex flex-col gap-3">
            <p>Historical Archives Division personnel were able to identify NORTHSTAR through recovered Commission documentation. The oldest surviving reference describes it as:</p>
            <div class="tech-border bg-[var(--color-panel)] p-3 text-white text-sm italic">"Polar Research Vessel - Long Duration Rift Survey Platform."</div>
            <p>A second document, a maintenance requisition rather than a research summary, references an experimental system designated <strong>Transit Core</strong> and a supply request for equipment Materials Science has been unable to identify by name: <span class="redact" onclick="revealRedact(this)">"stabilization medium, second formulation," quantity and composition both withheld even in the surviving requisition, as though the requester assumed the recipient already knew what was being asked for</span>.</p>
            <p>A third document contains only a partial sentence:</p>
            <div class="tech-border bg-[var(--color-panel)] p-3 text-white text-sm italic">"If NORTHSTAR fails to return, all associated research is to be-"</div>
            <p>The remainder of the document is missing. No record explains why the vessel was abandoned.</p>
            <p>Taken together, the three documents describe a program less concerned with what the vessel might discover than with what should happen if it did not come back - a tone Historical Archives has not observed in any other surviving Commission research file of comparable scale. Most Commission programs planned for failure by budgeting for another attempt. This one appears to have planned for containment.</p>
        </div>`;
    }

    function anSectionInterview() {

    window.toggleAnomalyLog = function(id) {
        const isPlaying = !!state.anomalyLogsOpen[id];
        if (isPlaying) {
            state.anomalyLogsOpen[id] = false;
            if (audioTimers[id]) { clearTimeout(audioTimers[id]); delete audioTimers[id]; }
            update();
            return;
        }
        const lines = AUDIO_LOG_LINES[id] || [];
        if ((state.anomalyLogsProgress[id] || 0) >= lines.length) {
            state.anomalyLogsProgress[id] = 0;
            state.anomalyLogsTyping[id] = null;
        }
        state.anomalyLogsOpen[id] = true;
        if (audioTimers[id]) clearTimeout(audioTimers[id]);

        const isNearBottom = () => {
            const logEl = document.getElementById('log-scroll-' + id);
            return !logEl || (logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40);
        };
        const followIfBottom = (wasAtBottom) => {
            if (!wasAtBottom) return;
            const logEl = document.getElementById('log-scroll-' + id);
            if (logEl) logEl.scrollTop = logEl.scrollHeight;
        };

        function typeStep() {
            if (!state.anomalyLogsOpen[id]) return;
            let typing = state.anomalyLogsTyping[id];
            if (!typing) {
                const lineIdx = state.anomalyLogsProgress[id] || 0;
                if (lineIdx >= lines.length) {
                    state.anomalyLogsOpen[id] = false;
                    update();
                    return;
                }
                typing = { line: lineIdx, chars: 0 };
                state.anomalyLogsTyping[id] = typing;
            }
            const wasAtBottom = isNearBottom();
            const fullText = lines[typing.line].text;
            if (typing.chars < fullText.length) {
                typing.chars += 1;
                update();
                followIfBottom(wasAtBottom);
                audioTimers[id] = setTimeout(typeStep, 20 + Math.random() * 26);
                return;
            }
            const finishedLine = typing.line;
            state.anomalyLogsProgress[id] = finishedLine + 1;
            state.anomalyLogsTyping[id] = null;
            update();
            followIfBottom(wasAtBottom);
            if (state.anomalyLogsProgress[id] >= lines.length) {
                state.anomalyLogsOpen[id] = false;
                update();
                return;
            }
            const prevTime = timeToSeconds(lines[finishedLine].time);
            const nextTime = timeToSeconds(lines[state.anomalyLogsProgress[id]].time);
            const wait = Math.min(3200, Math.max(450, (nextTime - prevTime) * 1000));
            audioTimers[id] = setTimeout(typeStep, wait);
        }

        update();
        audioTimers[id] = setTimeout(typeStep, 500);
    };
